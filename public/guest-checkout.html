<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Guest Checkout</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/guest-checkout.js" defer></script>
</head>

<body>
<div id="header_top">
  <ul id="authMenu">
    <li><a href="/categories.html">Categories</a></li>
    <li><a href="/contact.html">Contact</a></li>

    <li id="loginItem"><a href="/login.html">Login</a></li>
    <li id="accountItem" style="display:none;"><a href="/account.html">My Account</a></li>
    <li id="logoutItem" style="display:none;"><a href="#">Logout</a></li>

    <li><a href="/cart.html">Shopping Cart</a></li>
  </ul>
</div>
<header>
  <h1><a href="/?tags=">Fantas-T-Shirts</a></h1>
  <input type="text" id="search" placeholder="Search…" />
</header>
<div id="header_logo">
  <img src="img/Adobe Express - file.png" alt="Fantas-T-Shirts Logo" >
</div>

<section class="account-wrapper">

  <<div class="account-card checkout-card">

  <h2 class="checkout-title">Guest Checkout</h2>

  <form id="guestForm" class="checkout-form">

    <div class="form-grid">

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Street</label>
        <input type="text" name="street" required>
      </div>

      <div class="form-group">
        <label>House number</label>
        <input type="text" name="house_number" required>
      </div>

      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" required>
      </div>

      <div class="form-group">
        <label>State / Province</label>
        <input type="text" name="state" required>
      </div>

      <div class="form-group">
        <label>Country</label>
        <input type="text" name="country" required>
      </div>

    </div>

    <button type="submit" class="confirm-btn checkout-btn">
      Confirm & Generate Payment
    </button>

  </form>

  <div id="bankInfo" class="bank-panel" style="display:none;">
    <h3>Bank Transfer Details</h3>
    <p><strong>IBAN:</strong> BE12 3456 7890 1234</p>
    <p><strong>Reference:</strong> ORDER-<span id="orderRef"></span></p>
  </div>

</div>

</section>

<script src="/js/auth/ui.js"></script>

</body>
</html>
