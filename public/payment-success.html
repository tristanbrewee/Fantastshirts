<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Payment Successful</h2>
<p>Your order has been confirmed.</p>
<p>Order ID: <span id="orderId"></span></p>

  document.getElementById("orderId")
          .textContent = params.get("order");
</script>
